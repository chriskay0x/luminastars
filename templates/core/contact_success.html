{% extends 'core/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<section class="success-section">
    <div class="container success-content">

        <div class="success-icon">
            <svg viewBox="0 0 52 52" class="checkmark-svg">
                <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark-tick" fill="none" d="M14 27l8 8 16-16"/>
            </svg>
        </div>

        <span class="section-label">MESSAGE RECEIVED</span>
        <h1>Thank you for reaching out!</h1>
        <p class="success-message">
            We've received your message and a member of our team
            will get back to you within <strong>24 hours</strong>.
        </p>

        <div class="success-actions">
            <a href="{% url 'core:home' %}" class="btn btn-primary">
                Back to Home <i data-lucide="arrow-right"></i>
            </a>
            <a href="{% url 'celebrities:list' %}" class="btn btn-outline">
                Browse Talent
            </a>
        </div>

    </div>
</section>

{% endblock %}
